groups:
  - name: astradar
    rules:
      # plus de 5% de 5xx sur 5 min, pendant 5 min
      # le for evite d'alerter pour un petit pic
      - alert: TauxErreurs5xxEleve
        expr: |
          sum(rate(http_requests_total{code=~"5.."}[5m]))
          / sum(rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Plus de 5% d'erreurs 5xx sur l'appli"

      # p95 > 500ms pendant 10 min
      # normalement l'appli repond en quelques ms
      - alert: LatenceP95Degradee
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m]))
            by (le, endpoint)) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Le p95 de latence depasse 500ms"
